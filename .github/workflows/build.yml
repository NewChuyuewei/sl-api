name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

env:
  SL_REFERENCES: D:\scpsl-refs
  REFS_CACHE_KEY: scpsl-refs-996560-v2

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore SCP:SL reference cache
        id: refs-restore
        uses: actions/cache/restore@v4
        with:
          path: D:\scpsl-refs
          key: ${{ env.REFS_CACHE_KEY }}

      - name: Fetch SCP:SL dedicated server (cache miss)
        if: steps.refs-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile 'D:\steamcmd.zip'
          Expand-Archive -Path 'D:\steamcmd.zip' -DestinationPath 'D:\steamcmd' -Force
          # First steamcmd run only self-updates the bootstrapper and exits WITHOUT executing
          # chained commands. Run it once to settle, then install for real.
          & 'D:\steamcmd\steamcmd.exe' +quit
          $installed = $false
          for ($attempt = 1; $attempt -le 3 -and -not $installed; $attempt++) {
            & 'D:\steamcmd\steamcmd.exe' +force_install_dir 'D:\scpsl-server' +login anonymous +app_update 996560 validate +quit
            $installed = Test-Path 'D:\scpsl-server\SCPSL_Data\Managed\LabApi.dll'
            if (-not $installed) { Write-Output "Install attempt $attempt did not complete; retrying..." }
          }
          if (-not $installed) { throw 'SCP:SL dedicated server files were not installed.' }
          New-Item -ItemType Directory -Force -Path 'D:\scpsl-refs' | Out-Null
          Copy-Item 'D:\scpsl-server\SCPSL_Data\Managed\*.dll' 'D:\scpsl-refs'

      - name: Save SCP:SL reference cache
        if: steps.refs-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\scpsl-refs
          key: ${{ env.REFS_CACHE_KEY }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cywapi
          path: src/CywApi/bin/Release/net48/0CywApi.dll
